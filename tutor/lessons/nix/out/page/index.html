<style>
:root{
  --bg:#0E1216;--surface:#151B22;--raise:#1B232C;--line:#27303A;--ink:#E6EBF0;--muted:#8C97A4;--faint:#5E6874;
  --amber:#F2A93B;--ice:#8FD3FF;--coral:#E4715F;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-inline:20px;padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
h1{font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.15;margin:0;text-wrap:balance}
.len{font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.player{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
video{display:block;width:100%;height:100%}
.chapters{display:flex;gap:6px}
.ch{all:unset;cursor:pointer;min-width:0;flex-basis:0;display:flex;flex-direction:column;gap:7px}
.ch-bar{height:6px;border-radius:3px;background:var(--raise);position:relative;overflow:hidden}
.ch-bar::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--ice)}
.ch-name{font-size:13px;line-height:1.3;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.on .ch-name{color:var(--ink)}
.ch:hover .ch-name{color:var(--ink)}
.ch:focus-visible .ch-bar{outline:2px solid var(--ice);outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);
  border:1.5px solid var(--line);border-radius:6px;padding:6px 11px;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--faint)}
.btn:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.btn[aria-pressed="true"]{color:var(--bg);background:var(--ice);border-color:var(--ice)}
.btn.lost{color:var(--amber);border-color:rgba(242,169,59,.45)}
.btn.lost:hover{border-color:var(--amber)}
.btn.primary{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel .where{font:500 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.panel blockquote{margin:0;padding-left:12px;border-left:2px solid var(--amber);color:var(--ink);max-width:70ch}
.panel blockquote .prev{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.panel label{font-size:14px;color:var(--muted)}
textarea{font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:10px;min-height:72px;resize:vertical;width:100%;box-sizing:border-box}
textarea:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
details{color:var(--muted);font-size:14px}
summary{cursor:pointer;width:max-content}
summary:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.notes{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline}
.notes .t{all:unset;cursor:pointer;font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--ice);font-variant-numeric:tabular-nums}
.notes .t:focus-visible{outline:2px solid var(--ice)}
.notes .txt{color:var(--ink)}
.notes .txt i{color:var(--muted)}
.notes .x{all:unset;cursor:pointer;color:var(--faint);font-size:13px}
.notes .x:hover{color:var(--coral)}
@media (max-width:640px){.ch-name{display:none}.chapters{gap:4px}}
</style>
<div class="wrap">

<button class="ch" type="button" style="flex-grow:39.82" data-t="404.61" data-end="444.43" aria-label="Chapter 9: The answer"><span class="ch-bar"></span><span class="ch-name">The answer</span></button></nav>

<script>const CUES=[[0.8, 9.9, "Install GNU Hello, the classic tiny test program, with a normal package manager, and it lands at slash usr, slash bin, slash hello.", "s1_01"], [10.15, 20.46, "Install it with Nix, and it lands somewhere stranger: a directory in slash nix, slash store, whose name starts with thirty-two characters of what looks like noise.", "s1_02"], [20.71, 24.72, "That noise is a hash, and every package Nix installs has one.", "s1_03"], [25.97, 31.94, "Nix, and NixOS, the Linux distribution built on it, make some unusual promises.", "s1_04"], [31.99, 36.31, "Build the same thing twice and, as far as possible, get the same result.", "s1_05"], [36.36, 39.05, "Keep two versions of a package side by side.", "s1_06"], [39.09, 42.95, "Roll back an upgrade, for one program or for the whole machine.", "s1_07"], [43.2, 45.1, "Why is there a hash in every path?", "s1_08"], [45.15, 47.92, "And how does that one idea deliver all of that?", "s1_09"], [51.67, 55.12, "Most package managers put everything in shared places.", "s2_01"], [55.17, 57.86, "Programs go in slash usr, slash bin.", "s2_02"], [57.91, 60.69, "Libraries go in slash usr, slash lib.", "s2_03"], [60.94, 65.17, "Upgrade a library, and the new version overwrites the old one in place.", "s2_04"], [65.22, 70.5, "Every program that used the old one now gets the new one, whether it was built for it or not.", "s2_05"], [70.75, 76.51, "Two programs that need different versions of the same library often can't both have what they need.", "s2_06"], [76.56, 82.15, "Some libraries put a version number in the file name, but most things get exactly one path.", "s2_07"], [82.4, 90.88, "And an upgrade that stops halfway, say the power goes out, leaves some files new and some old: a system that matches no version at all.", "s2_08"], [92.63, 94.61, "Nix starts from a different picture.", "s3_01"], [94.66, 98.98, "Every package is built from a recipe, which Nix calls a derivation.", "s3_02"], [99.03, 110.52, "Nix treats that build as a pure function of its inputs, and the inputs are everything the build uses: the source code, the build script, the compiler, the libraries, and every option.", "s3_03"], [110.77, 116.52, "On Linux, Nix runs each build isolated by default, so it can use only what it declared.", "s3_04"], [116.57, 121.05, "Even a downloaded source file has to match a hash written in the recipe.", "s3_05"], [121.3, 129.62, "Nix computes a hash over all of those inputs, and names the output after it: slash nix, slash store, the hash, then the package name.", "s3_06"], [129.87, 132.16, "It can do that before building anything.", "s3_07"], [132.21, 138.98, "On this machine, Nix computed Hello's path from its recipe, and the package then landed exactly there.", "s3_08"], [140.03, 142.51, "So the hash is not a checksum of what came out.", "s3_09"], [142.56, 144.74, "It's a name for everything that went in.", "s3_10"], [146.69, 148.29, "Now change one input.", "s4_01"], [148.34, 152.17, "Here, one option of Hello's build: whether to run its tests.", "s4_02"], [152.42, 157.3, "The recipe is different, so the hash is different, and the new Hello gets a new path.", "s4_03"], [157.55, 159.77, "A small script called greet runs Hello.", "s4_04"], [159.82, 163.85, "Its inputs include Hello's path, so greet gets a new path too.", "s4_05"], [163.9, 166.51, "The change ripples to everything built from it.", "s4_06"], [166.76, 170.78, "Cowsay doesn't use Hello, so its path stays exactly the same.", "s4_07"], [171.83, 174.37, "And nothing that was already built gets touched.", "s4_08"], [174.41, 180.05, "The old Hello and the new Hello now sit side by side in the store, each in its own directory.", "s4_09"], [180.3, 186.18, "That's how two versions coexist: they can't overwrite each other, because they never share a path.", "s4_10"], [187.93, 189.87, "But Hello isn't self-contained.", "s5_01"], [189.92, 192.99, "It needs other things to run, like the C library.", "s5_02"], [193.04, 196.56, "So where does it find them, if not in slash usr, slash lib?", "s5_03"], [196.81, 200.98, "Its files refer to them by their full store paths, hashes included.", "s5_04"], [201.23, 205.87, "Nix finds those references by scanning the build's output for store paths.", "s5_05"], [205.92, 212.49, "Follow them, and the references of those, and you get the package's closure: everything it needs at run time.", "s5_06"], [212.74, 227.29, "Hello's closure is five paths: Hello itself, the C library, a library the C library pulls in, another that one needs in turn, and a small runtime library that ships with the compiler and that compiled programs use.", "s5_07"], [228.54, 233.54, "Copy those five paths to another machine of the same kind, and Hello runs there.", "s5_08"], [233.59, 238.33, "And things needed only to build it, like the compiler itself, aren't in the list.", "s5_09"], [239.88, 242.53, "So what does it mean to have a program installed?", "s6_01"], [242.78, 248.39, "In Nix, what you have installed is a generation: a small directory of links into the store.", "s6_02"], [248.44, 251.08, "Your profile is a link to one generation.", "s6_03"], [251.33, 253.97, "Install Hello: that's generation one.", "s6_04"], [254.02, 262.27, "Install cowsay: Nix creates generation two, with links to both, and then switches the profile's link to it, in a single step.", "s6_05"], [262.52, 265.76, "There's no moment when the profile is half old and half new.", "s6_06"], [265.81, 268.62, "It points to one generation, then to the other.", "s6_07"], [269.47, 272.78, "Roll back, and the link switches back to generation one.", "s6_08"], [272.83, 278.08, "Hello is there, cowsay is gone from the profile, and nothing in the store was deleted.", "s6_09"], [279.13, 281.91, "Old generations stay until you delete them.", "s6_10"], [281.96, 287.31, "Only then can Nix's garbage collector remove the store paths nothing else uses.", "s6_11"], [288.25, 292.87, "NixOS applies the same idea to an entire operating system.", "s7_01"], [293.12, 301.87, "You describe the system in configuration.nix, a file that can pull in others: the packages, the settings, the services to run.", "s7_02"], [301.92, 308.48, "Nix builds all of it, the programs, the configuration files, the start-up scripts, into one store path.", "s7_03"], [308.73, 312.62, "Here's a minimal configuration, evaluated on this machine.", "s7_04"], [312.67, 314.22, "It has one system path.", "s7_05"], [314.27, 319.5, "Add one line, turning on the nginx web server, and the system gets a different path.", "s7_06"], [319.55, 323.44, "Remove the line, and the path is exactly the first one again.", "s7_07"], [324.69, 330.78, "Switching to a new configuration makes a new system generation, and adds it to the boot menu.", "s7_08"], [330.83, 337.79, "If an upgrade goes wrong, you pick the previous generation when the machine starts, or roll back from the command line.", "s7_09"], [338.04, 341.25, "The link to the new generation switches in one step.", "s7_10"], [341.3, 348.84, "Bringing the running machine in line with it takes longer: services restart one by one, and a new kernel needs a reboot.", "s7_11"], [350.39, 352.56, "The hash promises the same inputs.", "s8_01"], [352.61, 354.88, "It doesn't always promise the same bytes.", "s8_02"], [355.13, 361.5, "Some builds stamp in the date, or vary in small ways from run to run: same path, different bytes.", "s8_03"], [361.55, 368.34, "A 2025 study rebuilt about seven hundred thousand packages from old Nixpkgs snapshots.", "s8_04"], [368.39, 374.67, "Between sixty-nine and ninety-one percent came out bit-for-bit identical, rising over the years.", "s8_05"], [375.71, 378.28, "And the inputs are only fixed if you fix them.", "s8_06"], [378.33, 382.38, "Nixpkgs, the collection the recipes come from, keeps moving.", "s8_07"], [382.43, 386.1, "To get the same inputs next year, pin the exact revision.", "s8_08"], [386.35, 389.85, "Rollback switches the software and its configuration.", "s8_09"], [389.9, 391.43, "It doesn't touch your data.", "s8_10"], [391.48, 395.82, "Say a new version of a database converted its files to a new format.", "s8_11"], [395.87, 403.2, "Roll back, and you get the old program, but the files stay converted, and the old program may not be able to read them.", "s8_12"], [404.95, 406.63, "So why a hash in every path?", "s9_01"], [406.69, 410.28, "Because the path names a build by everything that went into it.", "s9_02"], [410.53, 413.0, "That's what keeps anything from being overwritten.", "s9_03"], [413.05, 416.18, "Versions coexist because they never share a path.", "s9_04"], [416.23, 420.27, "Dependencies are exact, because they're referred to by their paths.", "s9_05"], [420.32, 425.58, "And an upgrade, or a rollback, is switching one link, for a program or for a whole system.", "s9_06"], [425.83, 427.98, "What the hash fixes is the inputs.", "s9_07"], [428.03, 433.31, "Pin them, and you get the same recipe again; the bytes usually, but not always, follow.", "s9_08"], [433.37, 436.07, "And back up your data, because rollback won't.", "s9_09"]];const CHAPTERS=["The question", "The trouble with shared paths", "A build is a function of its inputs", "Change an input, change the path", "The closure", "Installing is switching a link", "A whole system", "What the hash doesn't promise", "The answer"];const VERSION="v1";
const v=document.getElementById('v');
const chs=[...document.querySelectorAll('.ch')];
const titles=CHAPTERS;
chs.forEach(b=>b.addEventListener('click',()=>{v.currentTime=+b.dataset.t;v.play().catch(()=>{});}));
function tick(){
  const t=v.currentTime;
  chs.forEach(c=>{const a=+c.dataset.t,b=+c.dataset.end;c.classList.toggle('on',t>=a&&t<b);
    c.style.setProperty('--p',(t>=b?100:t<=a?0:(t-a)/(b-a)*100)+'%');});
}
v.addEventListener('timeupdate',tick);v.addEventListener('seeked',tick);tick();

const track=v.addTextTrack('captions','English','en');
CUES.forEach(c=>track.addCue(new VTTCue(c[0],c[1],c[2])));
track.mode='hidden';
const cc=document.getElementById('cc');
cc.addEventListener('click',()=>{const on=track.mode!=='showing';track.mode=on?'showing':'hidden';
  cc.setAttribute('aria-pressed',on);cc.textContent='Captions '+(on?'on':'off');});

function mmss(t){t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');}
function cueAt(t){let k=-1;CUES.forEach((c,i)=>{if(c[0]<=t)k=i;});return k;}
function chapterAt(t){let k=0;chs.forEach((c,i)=>{if(+c.dataset.t<=t)k=i;});return k;}

const lost=document.getElementById('lost'), panel=document.getElementById('panel'), status=document.getElementById('status');
const note=document.getElementById('note'), where=document.getElementById('where'), quote=document.getElementById('quote');
const save=document.getElementById('save'), cancel=document.getElementById('cancel');
const box=document.getElementById('mine'), list=document.getElementById('notes'), count=document.getElementById('count');
let db=null, moment=null;

function openPanel(){
  v.pause();
  const t=v.currentTime, k=cueAt(t), ch=chapterAt(t);
  moment={t:Math.round(t*10)/10, chapter:'s'+(ch+1), chapter_title:titles[ch],
          sentence:k>=0?CUES[k][3]:null, sentence_text:k>=0?CUES[k][2]:'',
          previous:k>0?CUES[k-1][3]:null, previous_text:k>0?CUES[k-1][2]:''};
  where.textContent=mmss(t)+' · '+titles[ch];
  quote.replaceChildren();
  if(moment.previous_text){const p=document.createElement('span');p.className='prev';p.textContent=moment.previous_text;quote.append(p);}
  quote.append(document.createTextNode(moment.sentence_text||'(before the narration starts)'));
  panel.hidden=false;note.focus();status.textContent='';
}
function closePanel(){panel.hidden=true;note.value='';moment=null;lost.focus();}
lost.addEventListener('click',openPanel);
cancel.addEventListener('click',closePanel);
save.addEventListener('click',async()=>{
  if(!db||!moment)return;
  save.disabled=true;
  const body=Object.assign({},moment,{note:note.value.trim().slice(0,2000),version:VERSION,at:new Date().toISOString()});
  try{
    await db.collection('feedback').add(body);
    status.textContent='Saved at '+mmss(body.t)+'. The tutor reads these and revises that part.';
    closePanel();
  }catch(e){
    status.textContent=e&&e.code==='quota_exceeded'?'The notes store is full; delete some notes below.'
      :'Could not save this note. Try again in a moment.';
  }finally{save.disabled=false;}
});

function render(snap){
  const docs=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);
  box.hidden=docs.length===0;
  count.textContent=docs.length+(docs.length===1?' note':' notes')+' saved';
  list.replaceChildren(...docs.map(d=>{
    const li=document.createElement('li');
    const t=document.createElement('button');t.className='t';t.type='button';t.textContent=mmss(d.t);
    t.addEventListener('click',()=>{v.currentTime=Math.max(0,d.t-3);v.play().catch(()=>{});});
    const txt=document.createElement('span');txt.className='txt';
    if(d.note){txt.textContent=d.note;}else{const i=document.createElement('i');i.textContent='(no note) '+(d.chapter_title||'');txt.append(i);}
    const x=document.createElement('button');x.className='x';x.type='button';x.textContent='Delete';
    x.setAttribute('aria-label','Delete the note at '+mmss(d.t));
    x.addEventListener('click',()=>db.doc('feedback/'+d.id).delete().catch(()=>{status.textContent='Could not delete that note.';}));
    li.append(t,txt,x);return li;}));
}

(async()=>{
  try{db=await (window.claude&&window.claude.use?window.claude.use('db'):null);}catch(e){db=null;}
  if(!db)return;
  lost.hidden=false;
  db.collection('feedback').onSnapshot(render,()=>{box.hidden=true;});
})();
</script>
