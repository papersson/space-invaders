<style>
:root{
  --bg:#0E1216;--surface:#151B22;--raise:#1B232C;--line:#27303A;--ink:#E6EBF0;--muted:#8C97A4;--faint:#5E6874;

}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-inline:20px;padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
h1{font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.15;margin:0;text-wrap:balance}
.len{font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.player{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%}

.chapters{display:flex;gap:6px}
.ch{all:unset;cursor:pointer;min-width:0;flex-basis:0;display:flex;flex-direction:column;gap:7px}
.ch-bar{height:6px;border-radius:3px;background:var(--raise);position:relative;overflow:hidden}
.ch-bar::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--ice)}
.ch-name{font-size:13px;line-height:1.3;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.on .ch-name{color:var(--ink)}
.ch:hover .ch-name{color:var(--ink)}
.ch:focus-visible .ch-bar{outline:2px solid var(--ice);outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);
  border:1.5px solid var(--line);border-radius:6px;padding:6px 11px;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--faint)}
.btn:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.btn[aria-pressed="true"]{color:var(--bg);background:var(--ice);border-color:var(--ice)}
.btn.lost{color:var(--amber);border-color:rgba(242,169,59,.45)}
.btn.lost:hover{border-color:var(--amber)}
.btn.primary{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel .where{font:500 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.panel blockquote{margin:0;padding-left:12px;border-left:2px solid var(--amber);color:var(--ink);max-width:70ch}
.panel blockquote .prev{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.panel label{font-size:14px;color:var(--muted)}
textarea{font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:10px;min-height:72px;resize:vertical;width:100%;box-sizing:border-box}
textarea:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
details{color:var(--muted);font-size:14px}
summary{cursor:pointer;width:max-content}
summary:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.notes{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline}
.notes .t{all:unset;cursor:pointer;font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--ice);font-variant-numeric:tabular-nums}
.notes .t:focus-visible{outline:2px solid var(--ice)}
.notes .txt{color:var(--ink)}
.notes .txt i{color:var(--muted)}
.notes .x{all:unset;cursor:pointer;color:var(--faint);font-size:13px}
.notes .x:hover{color:var(--coral)}
@media (max-width:640px){.ch-name{display:none}.chapters{gap:4px}}

<script>const CUES=[[0.8, 3.93, "Here's a web request handler, written in Python.", "s1_01"], [3.98, 11.25, "It needs a user and that user's orders, so it asks two services at the same time, with asyncio.gather.", "s1_02"], [11.5, 13.62, "The user service takes one second.", "s1_03"], [13.67, 16.79, "The orders service fails after a tenth of a second.", "s1_04"], [17.04, 20.52, "So the handler returns an error at a tenth of a second.", "s1_05"], [20.57, 22.5, "So far, that's what you'd want.", "s1_06"], [22.75, 25.61, "But the request to the user service is still running.", "s1_07"], [25.66, 31.07, "It finishes a full second after the request began, long after anyone was waiting for it.", "s1_08"], [32.32, 35.04, "And if it had failed, its error would go nowhere.", "s1_09"], [35.09, 37.7, "Nothing raises it, and nothing logs it.", "s1_10"], [38.75, 41.13, "Now serve a thousand requests at once.", "s1_11"], [41.19, 46.57, "All thousand handlers return almost at once, and a thousand tasks are still running.", "s1_12"], [47.62, 49.07, "The function returned.", "s1_13"], [49.12, 50.85, "Why is its work still running?", "s1_14"], [50.9, 53.17, "And what would make \"returned\" mean \"done\"?", "s1_15"], [56.92, 62.05, "Start with plain code: fetch the user, then fetch the orders, one after the other.", "s2_01"], [62.3, 64.98, "Each call has one way in and one way out.", "s2_02"], [65.03, 67.35, "When fetch_user returns, it's finished.", "s2_03"], [67.4, 70.15, "If it fails, the error comes back to the caller.", "s2_04"], [70.2, 78.95, "And if the caller gives up, say the client hangs up, the server cancels it: it asks the code to stop, and the call it's waiting on stops too.", "s2_05"], [79.2, 82.88, "So when the handler returns, everything it started is done.", "s2_06"], [82.93, 84.95, "You can treat it as a black box.", "s2_07"], [85.2, 86.25, "But it's slow.", "s2_08"], [86.3, 90.98, "The calls wait for each other, so the error arrives after one point one seconds.", "s2_09"], [92.03, 94.82, "That's why we start the two requests at the same time.", "s2_10"], [95.77, 98.81, "Starting a task is different from calling a function.", "s3_01"], [98.86, 102.7, "The start returns at once, and the task runs on by itself.", "s3_02"], [102.75, 107.15, "Control splits into two paths, and nothing makes the second one come back.", "s3_03"], [108.2, 112.08, "There are two common ways to wait for tasks, and both leave gaps.", "s3_04"], [112.33, 113.79, "The first is gather.", "s3_05"], [113.84, 116.32, "You'd expect it to behave like those calls.", "s3_06"], [116.37, 120.34, "It waits for both results, and when both requests succeed, it does.", "s3_07"], [120.59, 127.29, "But when one fails, gather by default passes that error on immediately, and doesn't cancel the other task.", "s3_08"], [127.34, 129.65, "Python's own documentation says so.", "s3_09"], [131.1, 135.56, "That's the request left running in the opening. gather waited for results.", "s3_10"], [135.61, 137.28, "It never owned the tasks.", "s3_11"], [137.53, 143.48, "The second way is to start both requests, then await them one at a time, the user request first.", "s3_12"], [143.53, 150.07, "If the client gives up after half a second, the user request is cancelled, because it's the one being awaited.", "s3_13"], [150.12, 153.22, "The orders request isn't, and runs on to the end.", "s3_14"], [154.47, 156.75, "So a real fix has to do three things.", "s3_15"], [156.8, 158.76, "Wait for every task it starts.", "s3_16"], [158.81, 162.11, "When one fails, cancel the rest and pass the error on.", "s3_17"], [162.16, 164.59, "And when the caller gives up, cancel them all.", "s3_18"], [166.34, 168.87, "This problem is older than concurrency.", "s4_01"], [168.92, 173.59, "In 1968, Edsger Dijkstra argued against the go to statement.", "s4_02"], [173.64, 179.36, "With jumps that can lead anywhere, it becomes hard to follow what a program is doing from its text.", "s4_03"], [179.61, 188.41, "The fix was structured programming: blocks, conditionals, loops and function calls, where control goes in at the top and comes out at the bottom.", "s4_04"], [188.66, 195.65, "Fifty years later, in 2018, Nathaniel Smith pointed out that starting a task is the same kind of jump.", "s4_05"], [195.69, 202.47, "Control goes in, and part of it never has to come out, so you can no longer treat a function as a black box.", "s4_06"], [202.52, 208.16, "His essay was called \"Notes on structured concurrency, or: Go statement considered harmful\".", "s4_07"], [209.41, 211.77, "The fix is the same too: a block.", "s4_08"], [211.82, 214.2, "Tasks started inside it can't outlive it.", "s4_09"], [214.25, 217.82, "The block doesn't end until every task in it has finished.", "s4_10"], [218.87, 224.9, "That rule is called structured concurrency, a name Martin S\u00fastrik had given it two years earlier.", "s4_11"], [224.94, 235.07, "Smith built it into his own library, Trio, and Python's asyncio later added the same kind of block, the task group, in version three point eleven.", "s4_12"], [237.02, 241.4, "Here's the handler again, with both requests started inside a task group.", "s5_01"], [241.65, 244.45, "The orders service fails at a tenth of a second.", "s5_02"], [244.5, 250.78, "At once, the task group cancels the user request, which asks it to stop, and waits until it has.", "s5_03"], [251.63, 253.97, "Then it raises the error in the handler.", "s5_04"], [254.02, 260.15, "It arrives inside an exception group, a container for errors, since more than one task could fail.", "s5_05"], [260.2, 262.86, "So a plain except ConnectionError won't match it.", "s5_06"], [262.91, 266.87, "The handler catches it with except star, which looks inside the group.", "s5_07"], [267.92, 272.77, "At a tenth of a second the handler returns, and nothing it started is still running.", "s5_08"], [272.82, 276.18, "So nothing is left to fail later, where no one would hear it.", "s5_09"], [276.43, 280.93, "A thousand requests: all the handlers return, and no tasks are left.", "s5_10"], [281.18, 289.27, "And if the client gives up after half a second, cancelling the handler cancels both requests inside it, not just the one being awaited.", "s5_11"], [290.52, 292.89, "So a task group gives three guarantees.", "s5_12"], [292.94, 295.46, "The block waits for every task started in it.", "s5_13"], [295.51, 299.67, "When one fails, the others are cancelled and the error reaches the caller.", "s5_14"], [299.72, 302.3, "And cancelling the caller cancels its tasks.", "s5_15"], [304.05, 306.74, "A task group can only ask a task to stop.", "s6_01"], [306.79, 309.5, "The request arrives at the task's next await.", "s6_02"], [309.55, 312.48, "It arrives as an exception, called CancelledError.", "s6_03"], [312.53, 317.89, "A task that never awaits, or that catches that exception and carries on, keeps running.", "s6_04"], [318.14, 325.95, "Here's a retry loop with a bare except: an except with no exception type, so it catches everything, cancellation included.", "s6_05"], [326.0, 331.55, "When the orders service fails, the user request catches its cancellation and tries again.", "s6_06"], [331.8, 333.74, "The task group has to wait for it.", "s6_07"], [333.79, 338.01, "The handler returns after one point one seconds, instead of a tenth.", "s6_08"], [339.26, 343.22, "Before, the stubborn work ran on after the handler returned.", "s6_09"], [343.27, 347.0, "Now it can't escape the block, so the handler waits for it instead.", "s6_10"], [347.25, 352.62, "And the rule covers only tasks started through the task group, with its own create_task.", "s6_11"], [352.67, 357.58, "A task started with plain asyncio.create_task is on its own again.", "s6_12"], [357.83, 360.55, "And it's about lifetimes, not shared data.", "s6_13"], [360.6, 364.86, "Two tasks in the same group can still race on a variable, or deadlock.", "s6_14"], [366.41, 368.42, "But this isn't a quirk of Python.", "s7_01"], [368.47, 371.9, "Here's the same handler in Go, with plain goroutines.", "s7_02"], [371.95, 381.82, "After a thousand requests, a thousand goroutines are left, and they never finish: each is waiting to hand its result to a handler that has already returned.", "s7_03"], [382.87, 385.1, "Go has no task group in the language.", "s7_04"], [385.15, 392.48, "A common convention is an error group, from Go's extended libraries: the closest thing Go has to a task group.", "s7_05"], [392.73, 399.95, "An error group works with a context: Go's standard way of passing cancellation and deadlines to goroutines.", "s7_06"], [400.2, 402.3, "With an error group, none are left.", "s7_07"], [402.95, 408.73, "The first error cancels the context, and here each goroutine checks the context and returns.", "s7_08"], [408.78, 411.9, "Like a task group, an error group can only ask.", "s7_09"], [412.15, 417.47, "Swift and Java have the same kind of block built in, Java's still as a preview feature.", "s7_10"], [417.52, 420.66, "Kotlin has it in its official coroutines library.", "s7_11"], [422.21, 425.62, "So why was the handler's work still running after it returned?", "s8_01"], [425.67, 434.99, "Because starting a task split control into two paths, and nothing made the second one come back. gather waited for the results, but it didn't own the tasks.", "s8_02"], [435.24, 441.53, "Structured concurrency gives every task an owner: a block that can't end until its tasks have.", "s8_03"], [441.58, 446.26, "In a task group, when one fails, the rest are cancelled and the error comes back.", "s8_04"], [446.31, 448.94, "When the caller is cancelled, so are its tasks.", "s8_05"], [449.19, 454.59, "The request fails at a tenth of a second, and at a tenth of a second nothing is left running.", "s8_06"], [454.84, 458.07, "Give every task an owner, and \"returned\" means \"done\".", "s8_07"]];const CHAPTERS=["The question", "What a call promises", "Starting a task", "Go to, again", "The same handler, in a task group", "What it doesn't promise", "Not just Python", "The answer"];const VERSION="v1";
const v=document.getElementById('v');
const chs=[...document.querySelectorAll('.ch')];
const titles=CHAPTERS;
chs.forEach(b=>b.addEventListener('click',()=>{v.currentTime=+b.dataset.t;v.play().catch(()=>{});}));
function tick(){
  const t=v.currentTime;
  chs.forEach(c=>{const a=+c.dataset.t,b=+c.dataset.end;c.classList.toggle('on',t>=a&&t<b);
    c.style.setProperty('--p',(t>=b?100:t<=a?0:(t-a)/(b-a)*100)+'%');});
}
v.addEventListener('timeupdate',tick);v.addEventListener('seeked',tick);tick();

const track=v.addTextTrack('captions','English','en');
CUES.forEach(c=>track.addCue(new VTTCue(c[0],c[1],c[2])));
track.mode='hidden';
const cc=document.getElementById('cc');
cc.addEventListener('click',()=>{const on=track.mode!=='showing';track.mode=on?'showing':'hidden';
  cc.setAttribute('aria-pressed',on);cc.textContent='Captions '+(on?'on':'off');});

function mmss(t){t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');}
function cueAt(t){let k=-1;CUES.forEach((c,i)=>{if(c[0]<=t)k=i;});return k;}
function chapterAt(t){let k=0;chs.forEach((c,i)=>{if(+c.dataset.t<=t)k=i;});return k;}

const lost=document.getElementById('lost'), panel=document.getElementById('panel'), status=document.getElementById('status');
const note=document.getElementById('note'), where=document.getElementById('where'), quote=document.getElementById('quote');
const save=document.getElementById('save'), cancel=document.getElementById('cancel');
const box=document.getElementById('mine'), list=document.getElementById('notes'), count=document.getElementById('count');
let db=null, moment=null;

function openPanel(){
  v.pause();
  const t=v.currentTime, k=cueAt(t), ch=chapterAt(t);
  moment={t:Math.round(t*10)/10, chapter:'s'+(ch+1), chapter_title:titles[ch],
          sentence:k>=0?CUES[k][3]:null, sentence_text:k>=0?CUES[k][2]:'',
          previous:k>0?CUES[k-1][3]:null, previous_text:k>0?CUES[k-1][2]:''};
  where.textContent=mmss(t)+' · '+titles[ch];
  quote.replaceChildren();
  if(moment.previous_text){const p=document.createElement('span');p.className='prev';p.textContent=moment.previous_text;quote.append(p);}
  quote.append(document.createTextNode(moment.sentence_text||'(before the narration starts)'));
  panel.hidden=false;note.focus();status.textContent='';
}
function closePanel(){panel.hidden=true;note.value='';moment=null;lost.focus();}
lost.addEventListener('click',openPanel);
cancel.addEventListener('click',closePanel);
save.addEventListener('click',async()=>{
  if(!db||!moment)return;
  save.disabled=true;
  const body=Object.assign({},moment,{note:note.value.trim().slice(0,2000),version:VERSION,at:new Date().toISOString()});
  try{
    await db.collection('feedback').add(body);
    status.textContent='Saved at '+mmss(body.t)+'. The tutor reads these and revises that part.';
    closePanel();
  }catch(e){
    status.textContent=e&&e.code==='quota_exceeded'?'The notes store is full; delete some notes below.'
      :'Could not save this note. Try again in a moment.';
  }finally{save.disabled=false;}
});

function render(snap){
  const docs=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);
  box.hidden=docs.length===0;
  count.textContent=docs.length+(docs.length===1?' note':' notes')+' saved';
  list.replaceChildren(...docs.map(d=>{
    const li=document.createElement('li');
    const t=document.createElement('button');t.className='t';t.type='button';t.textContent=mmss(d.t);
    t.addEventListener('click',()=>{v.currentTime=Math.max(0,d.t-3);v.play().catch(()=>{});});
    const txt=document.createElement('span');txt.className='txt';
    if(d.note){txt.textContent=d.note;}else{const i=document.createElement('i');i.textContent='(no note) '+(d.chapter_title||'');txt.append(i);}
    const x=document.createElement('button');x.className='x';x.type='button';x.textContent='Delete';
    x.setAttribute('aria-label','Delete the note at '+mmss(d.t));
    x.addEventListener('click',()=>db.doc('feedback/'+d.id).delete().catch(()=>{status.textContent='Could not delete that note.';}));
    li.append(t,txt,x);return li;}));
}

(async()=>{
  try{db=await (window.claude&&window.claude.use?window.claude.use('db'):null);}catch(e){db=null;}
  if(!db)return;
  lost.hidden=false;
  db.collection('feedback').onSnapshot(render,()=>{box.hidden=true;});
})();
</script>
