<title>From LLM to Agent</title>

<style>
:root{
  --bg:#0E1216;--surface:#151B22;--raise:#1B232C;--line:#27303A;--ink:#E6EBF0;--muted:#8C97A4;--faint:#5E6874;
  --amber:#F2A93B;--ice:#8FD3FF;--coral:#E4715F;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-inline:20px;padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
h1{font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.15;margin:0;text-wrap:balance}
.len{font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.player{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
video{display:block;width:100%;height:100%}
.chapters{display:flex;gap:6px}
.ch{all:unset;cursor:pointer;min-width:0;flex-basis:0;display:flex;flex-direction:column;gap:7px}
.ch-bar{height:6px;border-radius:3px;background:var(--raise);position:relative;overflow:hidden}
.ch-bar::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--ice)}
.ch-name{font-size:13px;line-height:1.3;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.on .ch-name{color:var(--ink)}
.ch:hover .ch-name{color:var(--ink)}
.ch:focus-visible .ch-bar{outline:2px solid var(--ice);outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);
  border:1.5px solid var(--line);border-radius:6px;padding:6px 11px;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--faint)}
.btn:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.btn[aria-pressed="true"]{color:var(--bg);background:var(--ice);border-color:var(--ice)}
.btn.lost{color:var(--amber);border-color:rgba(242,169,59,.45)}
.btn.lost:hover{border-color:var(--amber)}
.btn.primary{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted)}
.credit{margin:0;font-size:12px;color:var(--faint)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel .where{font:500 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.panel blockquote{margin:0;padding-left:12px;border-left:2px solid var(--amber);color:var(--ink);max-width:70ch}
.panel blockquote .prev{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.panel label{font-size:14px;color:var(--muted)}
textarea{font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:10px;min-height:72px;resize:vertical;width:100%;box-sizing:border-box}
textarea:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
details{color:var(--muted);font-size:14px}
summary{cursor:pointer;width:max-content}
summary:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.notes{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline}
.notes .t{all:unset;cursor:pointer;font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--ice);font-variant-numeric:tabular-nums}
.notes .t:focus-visible{outline:2px solid var(--ice)}
.notes .txt{color:var(--ink)}
.notes .txt i{color:var(--muted)}
.notes .x{all:unset;cursor:pointer;color:var(--faint);font-size:13px}
.notes .x:hover{color:var(--coral)}
@media (max-width:640px){.ch-name{display:none}.chapters{gap:4px}}
</style>
<div class="wrap">
  <header><h1>From LLM to Agent</h1><span class="len">7:52</span></header>
  <div class="player"><video id="v" controls preload="metadata" poster="poster.jpg" playsinline>

  <nav class="chapters" aria-label="Chapters"><button class="ch" type="button" style="flex-grow:32.72" data-t="0.00" data-end="32.72" aria-label="Chapter 1: The question"><span class="ch-bar"></span><span class="ch-name">The question</span></button>
<button class="ch" type="button" style="flex-grow:56.28" data-t="32.72" data-end="89.00" aria-label="Chapter 2: What an LLM is"><span class="ch-bar"></span><span class="ch-name">What an LLM is</span></button>
<button class="ch" type="button" style="flex-grow:73.40" data-t="89.00" data-end="162.40" aria-label="Chapter 3: Text that is an action"><span class="ch-bar"></span><span class="ch-name">Text that is an action</span></button>
<button class="ch" type="button" style="flex-grow:49.81" data-t="162.40" data-end="212.21" aria-label="Chapter 4: The result goes back in"><span class="ch-bar"></span><span class="ch-name">The result goes back in</span></button>
<button class="ch" type="button" style="flex-grow:79.60" data-t="212.21" data-end="291.81" aria-label="Chapter 5: The loop"><span class="ch-bar"></span><span class="ch-name">The loop</span></button>
<button class="ch" type="button" style="flex-grow:89.18" data-t="291.81" data-end="380.99" aria-label="Chapter 6: Why it took until now"><span class="ch-bar"></span><span class="ch-name">Why it took until now</span></button>
<button class="ch" type="button" style="flex-grow:52.12" data-t="380.99" data-end="433.11" aria-label="Chapter 7: The harness"><span class="ch-bar"></span><span class="ch-name">The harness</span></button>
<button class="ch" type="button" style="flex-grow:38.95" data-t="433.11" data-end="472.06" aria-label="Chapter 8: The answer"><span class="ch-bar"></span><span class="ch-name">The answer</span></button></nav>
  
  <div class="bar">
    <button id="cc" class="btn" type="button" aria-pressed="false">Captions off</button>

  <section id="panel" class="panel" hidden aria-label="What lost you">
    <div id="where" class="where"></div>

  <details id="mine" hidden><summary id="count"></summary><ul id="notes" class="notes"></ul></details>
</div>
<script>const CUES=[[0.8, 3.96, "In late 2022, ChatGPT arrived.", "s1_01"], [4.12, 6.13, "You typed a message, and it wrote back.", "s1_02"], [6.26, 7.91, "It could talk, and that was all.", "s1_03"], [8.76, 11.38, "Now there are AI agents that do things.", "s1_04"], [11.67, 17.9, "Give one a bug in some code, and it reads the files, runs the tests that check the code, and fixes the bug.", "s1_05"], [18.15, 21.5, "Underneath, it's the same kind of model as the one in the chat.", "s1_06"], [21.73, 24.04, "And a model like that only writes text.", "s1_07"], [24.89, 26.44, "So what sits in between?", "s1_08"], [26.6, 30.62, "How do you get from a model that writes text, to an agent that fixes a bug?", "s1_09"], [33.07, 34.19, "Start with the model.", "s2_01"], [34.49, 42.19, "It's called an LLM, a large language model, and it does one thing: it predicts the next word, or sometimes a piece of a word.", "s2_02"], [42.84, 46.63, "Give a small, freely available model the words \"I made a cup of\".", "s2_03"], [46.83, 49.11, "It gives every word it knows a probability.", "s2_04"], [49.34, 51.22, "\"Tea\" gets thirty-one percent.", "s2_05"], [51.5, 53.07, "\"Coffee\", nineteen.", "s2_06"], [53.16, 55.06, "Everything else is far behind.", "s2_07"], [56.31, 59.01, "Pick one of the likely words, and add it to the text.", "s2_08"], [59.17, 62.08, "Then predict again: \"tea\", then \"and\", then \"I\".", "s2_09"], [63.42, 65.46, "Over and over, one word at a time.", "s2_10"], [65.71, 67.93, "That's all writing is, for an LLM.", "s2_11"], [68.78, 70.94, "It works only from the text in front of it.", "s2_12"], [71.19, 73.33, "That text is called its context.", "s2_13"], [73.52, 76.44, "The model keeps no memory from one use to the next.", "s2_14"], [77.29, 79.07, "So keep two facts in mind.", "s2_15"], [79.24, 81.75, "What comes out of an LLM is text.", "s2_16"], [81.87, 83.57, "It learned a lot in training.", "s2_17"], [83.81, 87.2, "But about your task, it knows only what's in its context.", "s2_18"], [89.35, 90.42, "Here's a task.", "s3_01"], [90.49, 94.57, "A small shop's billing code stops with an error: no price for \"gadget\".", "s3_02"], [95.42, 98.22, "You might picture the model reaching into the files itself.", "s3_03"], [98.46, 105.35, "So ask a model on its own to fix it: not the small one, but a large model, like the ones behind chat assistants.", "s3_04"], [105.66, 111.3, "In one try, it wrote that it would explore the project, and even wrote out a request to run a command.", "s3_05"], [111.58, 115.3, "But nothing was there to carry it out, and the tests still failed.", "s3_06"], [116.75, 119.0, "Text on its own doesn't do anything.", "s3_07"], [119.23, 122.55, "So put a program next to the model, to watch what it writes.", "s3_08"], [122.8, 126.96, "Then give the model a format for requests, described at the top of its context.", "s3_09"], [127.99, 130.85, "A line that starts \"search:\", then some words.", "s3_10"], [130.93, 133.53, "Or \"open file:\", then a file name.", "s3_11"], [133.83, 137.52, "Real agents use a stricter format, but the idea is the same.", "s3_12"], [138.17, 141.61, "Now the model writes a line: search, \"no price for\".", "s3_13"], [141.86, 146.18, "The program spots the request, and searches the project's files for those words.", "s3_14"], [147.63, 154.34, "Each thing the program can do for the model is called a tool: search, open a file, edit a file, run the tests.", "s3_15"], [155.39, 157.05, "Notice who did the searching.", "s3_16"], [157.17, 159.36, "The model only wrote a line of text.", "s3_17"], [159.4, 160.8, "The program did the work.", "s3_18"], [162.75, 164.19, "The search found something.", "s4_01"], [164.24, 165.77, "But the model can't see it.", "s4_02"], [165.89, 168.82, "Remember: it knows only what's in its context.", "s4_03"], [169.07, 172.0, "So the program pastes the result into the context.", "s4_04"], [172.28, 176.32, "One match: line eight of a file called prices.py.", "s4_05"], [177.06, 181.92, "Then it runs the model again, on the whole context, because the model remembers nothing.", "s4_06"], [182.97, 185.82, "Now the model continues with the result in view.", "s4_07"], [186.06, 189.53, "It knows something it couldn't have known before: where the error comes from.", "s4_08"], [189.69, 192.9, "So it writes its next request: open that file.", "s4_09"], [193.95, 195.8, "You've probably seen this already.", "s4_10"], [196.04, 200.16, "In 2023, the popular chat assistants started searching the web.", "s4_11"], [200.42, 201.68, "It's the same trick.", "s4_12"], [201.95, 207.17, "The model writes a search, a program runs it, and the results are pasted into the context.", "s4_13"], [207.42, 210.41, "Then the model answers, with those pages in view.", "s4_14"], [212.56, 214.19, "One step won't fix a bug.", "s5_01"], [214.19, 215.18, "So repeat.", "s5_02"], [215.4, 220.39, "The model writes a request, the program carries it out, and the result goes into the context.", "s5_03"], [220.55, 221.42, "Then again.", "s5_04"], [222.47, 226.02, "This goes on until the model writes a reply with no request in it.", "s5_05"], [226.34, 228.6, "That's its answer, and the loop stops.", "s5_06"], [229.45, 233.6, "A model working in a loop like this, using tools, is called an agent.", "s5_07"], [234.85, 236.58, "Here's how the whole run went.", "s5_08"], [236.88, 242.83, "After the search and the file you've seen, it searches for where that code is used, and opens that file too.", "s5_09"], [243.88, 246.7, "The price list spells it \"Gadget\", with a capital G.", "s5_10"], [246.45, 249.71, "So it edits the lookup: now \"gadget\" finds \"Gadget\".", "s5_11"], [250.47, 251.99, "Then it runs the tests.", "s5_12"], [252.24, 253.08, "They fail.", "s5_13"], [253.05, 255.14, "Ben's bill should come to thirty-seven.", "s5_14"], [255.27, 257.09, "It comes to thirty-nine fifty.", "s5_15"], [258.54, 263.82, "That failure goes into the context, like any other result, and it changes the next step.", "s5_16"], [264.49, 268.68, "The model looks at the test and at Ben's orders, and finds a second mistake.", "s5_17"], [270.56, 273.57, "The bulk discount only kicked in at eleven items.", "s5_18"], [273.75, 275.11, "It should start at ten.", "s5_19"], [276.16, 278.34, "It edits that, and runs the tests again.", "s5_20"], [278.44, 279.78, "This time they pass.", "s5_21"], [280.49, 282.61, "It writes its answer, and the loop stops.", "s5_22"], [283.86, 285.37, "That was twelve requests.", "s5_23"], [285.44, 287.43, "Nobody wrote them down in advance.", "s5_24"], [287.61, 290.01, "Each one followed from the results before it.", "s5_25"], [292.16, 296.45, "If the loop is that simple, why did agents only start working recently?", "s6_01"], [296.7, 298.79, "People tried, in 2023.", "s6_02"], [299.08, 304.62, "They ran models in loops like this one, and the loops often got stuck, going round in circles.", "s6_03"], [305.67, 308.44, "Part of the problem is that small mistakes add up.", "s6_04"], [308.65, 314.6, "Say each step goes right ninety-five times in a hundred, whatever happened before, and nothing catches a mistake.", "s6_05"], [315.4, 316.73, "Start a hundred runs.", "s6_06"], [316.75, 318.94, "About ninety-five get the first step right.", "s6_07"], [319.19, 323.52, "Of those, ninety-five percent get the second step right too: about ninety.", "s6_08"], [323.7, 327.25, "Every step keeps ninety-five percent of the runs still on track.", "s6_09"], [328.74, 331.88, "After twenty steps, that's about thirty-six of the hundred.", "s6_10"], [332.62, 333.58, "About a third.", "s6_11"], [334.83, 336.28, "Three things changed.", "s6_12"], [336.49, 341.38, "First, models were trained to work in this loop, so each step became more reliable.", "s6_13"], [341.66, 344.94, "Suppose that lifts each step to ninety-nine in a hundred.", "s6_14"], [345.19, 350.62, "Then about eighty-two of the hundred runs get all twenty steps right: about four in five.", "s6_15"], [352.37, 355.13, "Second, tasks like coding come with feedback.", "s6_16"], [355.41, 360.47, "A failing test catches a mistake, as it caught the discount, and the next step can fix it.", "s6_17"], [361.52, 366.39, "Third, agents find what they need by searching, step by step, as that run did.", "s6_18"], [366.69, 369.55, "Claude Code, a coding agent, works that way.", "s6_19"], [369.83, 373.67, "Its developers first tried building an index of the code in advance.", "s6_20"], [373.88, 377.18, "But code keeps changing, and an index goes out of date.", "s6_21"], [377.42, 379.19, "They've said searching worked better.", "s6_22"], [381.34, 383.23, "Now put names on the whole picture.", "s7_01"], [383.48, 385.33, "The LLM is the model.", "s7_02"], [385.53, 387.71, "Everything around it is called the harness.", "s7_03"], [388.96, 392.61, "The harness writes the starting instructions, with the request format.", "s7_04"], [393.0, 397.93, "It holds the tools, and the program that carries out each request, and it runs the loop.", "s7_05"], [398.98, 401.13, "A real harness does two more things.", "s7_06"], [401.29, 406.88, "Before an edit, like the one to the price lookup, it can check permission, sometimes by asking you.", "s7_07"], [407.74, 412.47, "And every result makes the context longer, but a context can only hold so much.", "s7_08"], [412.81, 418.37, "When it fills up, the harness trims it, by dropping old results or summarizing older steps.", "s7_09"], [419.62, 422.38, "So an agent is an LLM plus a harness.", "s7_10"], [423.83, 428.51, "That's five words to keep: LLM, context, tool, harness, and agent.", "s7_11"], [433.46, 438.22, "So, how do you get from a model that only writes text to an agent that fixes a bug?", "s8_01"], [438.47, 440.18, "The model still does one thing.", "s8_02"], [440.3, 442.61, "It predicts the next word, one at a time.", "s8_03"], [442.86, 448.37, "The harness turns some of that text into actions, and pastes the results back into the context.", "s8_04"], [448.62, 451.55, "And the loop turns single steps into a whole job.", "s8_05"], [452.6, 455.77, "ChatGPT in 2022 could only talk.", "s8_06"], [455.94, 457.72, "An agent is still talking.", "s8_07"], [457.98, 463.31, "The difference is the harness: a program that listens to what the model writes, and acts on it.", "s8_08"]];const CHAPTERS=["The question", "What an LLM is", "Text that is an action", "The result goes back in", "The loop", "Why it took until now", "The harness", "The answer"];const VERSION="v1";
const v=document.getElementById('v');
const chs=[...document.querySelectorAll('.ch')];
const titles=CHAPTERS;
chs.forEach(b=>b.addEventListener('click',()=>{v.currentTime=+b.dataset.t;v.play().catch(()=>{});}));
function tick(){
  const t=v.currentTime;
  chs.forEach(c=>{const a=+c.dataset.t,b=+c.dataset.end;c.classList.toggle('on',t>=a&&t<b);
    c.style.setProperty('--p',(t>=b?100:t<=a?0:(t-a)/(b-a)*100)+'%');});
}
v.addEventListener('timeupdate',tick);v.addEventListener('seeked',tick);tick();

const track=v.addTextTrack('captions','English','en');
CUES.forEach(c=>track.addCue(new VTTCue(c[0],c[1],c[2])));
track.mode='hidden';
const cc=document.getElementById('cc');
cc.addEventListener('click',()=>{const on=track.mode!=='showing';track.mode=on?'showing':'hidden';
  cc.setAttribute('aria-pressed',on);cc.textContent='Captions '+(on?'on':'off');});

function mmss(t){t=Math.max(0,t);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');}
function cueAt(t){let k=-1;CUES.forEach((c,i)=>{if(c[0]<=t)k=i;});return k;}
function chapterAt(t){let k=0;chs.forEach((c,i)=>{if(+c.dataset.t<=t)k=i;});return k;}

const lost=document.getElementById('lost'), panel=document.getElementById('panel'), status=document.getElementById('status');
const note=document.getElementById('note'), where=document.getElementById('where'), quote=document.getElementById('quote');
const save=document.getElementById('save'), cancel=document.getElementById('cancel');
const box=document.getElementById('mine'), list=document.getElementById('notes'), count=document.getElementById('count');
let db=null, moment=null;

function openPanel(){
  v.pause();
  const t=v.currentTime, k=cueAt(t), ch=chapterAt(t);
  moment={t:Math.round(t*10)/10, chapter:'s'+(ch+1), chapter_title:titles[ch],
          sentence:k>=0?CUES[k][3]:null, sentence_text:k>=0?CUES[k][2]:'',
          previous:k>0?CUES[k-1][3]:null, previous_text:k>0?CUES[k-1][2]:''};
  where.textContent=mmss(t)+' · '+titles[ch];
  quote.replaceChildren();
  if(moment.previous_text){const p=document.createElement('span');p.className='prev';p.textContent=moment.previous_text;quote.append(p);}
  quote.append(document.createTextNode(moment.sentence_text||'(before the narration starts)'));
  panel.hidden=false;note.focus();status.textContent='';
}
function closePanel(){panel.hidden=true;note.value='';moment=null;lost.focus();}
lost.addEventListener('click',openPanel);
cancel.addEventListener('click',closePanel);
save.addEventListener('click',async()=>{
  if(!db||!moment)return;
  save.disabled=true;
  const body=Object.assign({},moment,{note:note.value.trim().slice(0,2000),version:VERSION,at:new Date().toISOString()});
  try{
    await db.collection('feedback').add(body);
    status.textContent='Saved at '+mmss(body.t)+'. The tutor reads these and revises that part.';
    closePanel();
  }catch(e){
    status.textContent=e&&e.code==='quota_exceeded'?'The notes store is full; delete some notes below.'
      :'Could not save this note. Try again in a moment.';
  }finally{save.disabled=false;}
});

function render(snap){
  const docs=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);
  box.hidden=docs.length===0;
  count.textContent=docs.length+(docs.length===1?' note':' notes')+' saved';
  list.replaceChildren(...docs.map(d=>{
    const li=document.createElement('li');
    const t=document.createElement('button');t.className='t';t.type='button';t.textContent=mmss(d.t);
    t.addEventListener('click',()=>{v.currentTime=Math.max(0,d.t-3);v.play().catch(()=>{});});
    const txt=document.createElement('span');txt.className='txt';
    if(d.note){txt.textContent=d.note;}else{const i=document.createElement('i');i.textContent='(no note) '+(d.chapter_title||'');txt.append(i);}
    const x=document.createElement('button');x.className='x';x.type='button';x.textContent='Delete';
    x.setAttribute('aria-label','Delete the note at '+mmss(d.t));
    x.addEventListener('click',()=>db.doc('feedback/'+d.id).delete().catch(()=>{status.textContent='Could not delete that note.';}));
    li.append(t,txt,x);return li;}));
}

(async()=>{
  try{db=await (window.claude&&window.claude.use?window.claude.use('db'):null);}catch(e){db=null;}
  if(!db)return;
  lost.hidden=false;
  db.collection('feedback').onSnapshot(render,()=>{box.hidden=true;});
})();
</script>
